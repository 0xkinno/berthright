[workspace]
resolver = "2"
members = ["contracts/portage", "contracts/allotment", "contracts/tusd"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/0xkinno/berthright"

[workspace.dependencies]
near-sdk = { version = "=5.29.0" }
near-contract-standards = { version = "=5.29.0" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
