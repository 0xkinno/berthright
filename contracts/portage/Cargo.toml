[package]
name = "portage"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Berthright wage chest: four months of crew wages locked before sign-on, paid into House of Stake leased-name berths"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
proptest = "1"
near-workspaces = "=0.22.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]
